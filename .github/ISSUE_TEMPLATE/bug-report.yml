name: Bug report
description: Report a crash, a wrong result or a performance problem. A reproducer binary is mandatory.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem!

        Please use a title that names the specific failure, such as the assertion message or the wrong result, and the binary it happens on. Format identifiers as code.

        > [!TIP]
        > Write `` Crash on `vmlinux`: Register 'st0_x86' must not be returned from a raw 'x86_64' function `` or `` `libmagic.so` produces a `PrimitiveType` of size 6 ``, not "Crash when decompiling" or "Can't process my exe".

        **Every report needs a reproducer: the exact binary you ran rev.ng on.** We fix bugs by reproducing them. Without the binary we cannot do that, and the issue will be closed.

  - type: checkboxes
    id: checklist
    attributes:
      label: I assert that this issue is actionable
      description: |
        This issue tracker is for bugs we can reproduce and fix. If you have a question or need help using rev.ng, read the [documentation](https://docs.rev.ng) and ask on [Discord](https://discord.gg/wEQtgKJxcX) or [Discourse](https://discuss.rev.ng/) instead.
      options:
        - label: "I assert that this is a bug and not a question or a support request."
          required: true
        - label: "I assert that this is not a [duplicate of an existing issue](https://github.com/revng/revng/issues?q=is%3Aissue)."
          required: true
        - label: "I assert that I installed rev.ng [as documented](https://docs.rev.ng/user-manual/initial-setup/): binary distribution, Docker image or orchestra. Other ways of building rev.ng are not supported."
          required: true
        - label: "I assert that the problem still happens with the latest version of rev.ng."
          required: true
        - label: "I assert that this issue reports a single problem. I will open a separate issue for each other problem."
          required: true
        - label: "I assert that I attached the binary, sent it to `info@rev.ng`, or linked the smallest crash with the same stack trace on mass.rev.ng, and that my links can be opened without logging in. I understand that issues without a reproducer will be closed."
          required: true
        - label: "I assert that I reported the exact commands and their full output as text, not as screenshots."
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Crash or assertion failure
        - Wrong decompiled code or analysis result
        - Performance (too slow or out of memory)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: rev.ng version
      description: The output of `revng --version`. To update, run the binary distribution `install.sh` again, `docker pull revng/revng`, or `orc update` followed by `orc install revng`.
      placeholder: rev.ng version 1234567
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Binary distribution
        - Docker image (revng/revng)
        - orchestra
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: The exact `revng` commands you ran, starting from the binary, so we can run them on the reproducer.
      placeholder: revng quick artifact emit-c-as-single-file ./program -o program.c
      render: shell
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe the problem. For wrong results, quote the relevant code in a code block.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected instead. For wrong results, show the code you expected, and the original source if you have it. For crashes, "No crash" is enough.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output, including the error message and the stack trace. If it does not fit, attach it as `output.log` in the Reproducer field.
      render: text

  - type: markdown
    attributes:
      value: |
        ### Reproducer

        Attach the binary in the field below. GitHub does not accept executables: put the binary in a `.zip` archive (for instance `zip reproducer.zip ./program`) and drag the archive into the field. If it is larger than 25 MB, upload it somewhere that does not require logging in and paste the link.

        If you cannot attach the binary publicly, send it to `info@rev.ng` and mention the issue.

        If you cannot share the binary at all and rev.ng crashed, link a crash from our mass testing instead:

        1. Open [mass.rev.ng/crashes.html](https://mass.rev.ng/crashes.html).
        2. Find a crash with the same stack trace as yours (*Actions* > *View log* shows the log of each crash).
        3. Type its *Stacktrace* ID in the search box and sort by *.text size*, smallest first.
        4. Link the first row (*Actions* > *Open details*).

        **If none of the above is possible, we cannot work on the issue and we will close it.**

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: The zipped binary, a note that you sent it to `info@rev.ng`, or a mass.rev.ng link. Also tell us where the binary comes from or, if you compiled it, the compiler, its version and the flags.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Performance problems

        Skip this section unless rev.ng is too slow or runs out of memory.

        Tell us the size of the binary: `wc -c < BINARY` on Linux and macOS, `(Get-Item BINARY).Length` in PowerShell.

        Tell us the size of its code too:

        | Format  | Command | What to report |
        |---------|---------|----------------|
        | ELF     | `size -A -d BINARY` | the `.text` row |
        | PE/COFF | `llvm-size -A -d BINARY` or, on Windows, `dumpbin /headers BINARY` | the `.text` row, or the `size of code` line |
        | Mach-O  | `size -m BINARY` on macOS, `llvm-size -m BINARY` elsewhere | the `Section __text` line |

        If there are other executable sections, report them as well: `llvm-objdump -h BINARY` lists them, on any format, with type `TEXT`.

        Finally, attach an execution trace. Run your command again with `-- --trace=trace.json` at the end, for instance:

        ```sh
        revng quick artifact emit-c-as-single-file BINARY -o program.c -- --trace=trace.json
        ```

        If it never ends, interrupt it with Ctrl-C after a while: the trace is saved anyway. Compress it with `gzip -9 trace.json` and attach `trace.json.gz` below. You can explore it yourself by opening it in [Perfetto UI](https://ui.perfetto.dev).

  - type: textarea
    id: performance
    attributes:
      label: Performance details
      description: Only for performance problems.
      placeholder: |
        Binary size:
        Code size:
        Time and memory used, and on what machine (CPU, RAM):
        Trace: trace.json.gz attached
